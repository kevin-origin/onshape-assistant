<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      background: #1a1a2e;
      color: #e0e0e0;
      padding: 12px;
    }
    h2 {
      font-size: 14px;
      color: #fff;
      margin-bottom: 10px;
      border-bottom: 1px solid #333;
      padding-bottom: 6px;
    }
    h3 {
      font-size: 13px;
      color: #fff;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-back {
      background: none;
      border: 1px solid #444;
      color: #7ec8e3;
      padding: 2px 8px;
      border-radius: 3px;
      font-size: 11px;
      cursor: pointer;
      flex: none;
    }
    .btn-back:hover { border-color: #7ec8e3; }
    label {
      display: block;
      font-size: 11px;
      color: #aaa;
      margin-bottom: 3px;
      margin-top: 10px;
    }
    textarea, input[type="text"] {
      width: 100%;
      background: #16213e;
      border: 1px solid #333;
      color: #e0e0e0;
      border-radius: 4px;
      padding: 6px 8px;
      font-family: monospace;
      font-size: 12px;
      resize: vertical;
    }
    textarea { height: 60px; }
    input[type="text"] { height: 30px; }
    .btn-row {
      display: flex;
      gap: 6px;
      margin-top: 12px;
    }
    button {
      flex: 1;
      padding: 7px 10px;
      border: none;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-menu {
      background: #16213e;
      color: #e0e0e0;
      border: 1px solid #333;
      padding: 12px 10px;
      text-align: left;
      font-size: 13px;
      margin-bottom: 6px;
      border-radius: 6px;
    }
    .btn-menu:hover { border-color: #7ec8e3; color: #fff; }
    .btn-menu .menu-desc {
      font-size: 10px;
      color: #666;
      margin-top: 3px;
      font-weight: 400;
    }
    .btn-draw { background: #1b4332; color: #95d5b2; }
    .btn-scan { background: #0f3460; color: #fff; }
    .btn-rescan { background: #1a1a40; color: #7ec8e3; border: 1px solid #333; }
    #status {
      margin-top: 10px;
      padding: 6px 8px;
      background: #16213e;
      border-radius: 4px;
      font-size: 11px;
      color: #7ec8e3;
      min-height: 20px;
      display: none;
    }
    #results {
      margin-top: 10px;
      max-height: 200px;
      overflow-y: auto;
      display: none;
    }
    .result-item {
      padding: 5px 8px;
      background: #16213e;
      border-radius: 3px;
      margin-bottom: 3px;
      font-size: 11px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .result-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .badge {
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 8px;
      font-weight: 600;
      margin-left: 6px;
      white-space: nowrap;
    }
    .badge-ok { background: #1b4332; color: #95d5b2; }
    .badge-warn { background: #533a0f; color: #f0c040; }
    .badge-err { background: #4a1525; color: #ff6b6b; }
    .summary {
      font-size: 11px;
      color: #aaa;
      margin-top: 6px;
      margin-bottom: 4px;
    }
    #drawLog {
      margin-top: 8px;
      max-height: 180px;
      overflow-y: auto;
      font-size: 11px;
      font-family: monospace;
      color: #aaa;
      display: none;
    }
    #drawLog .log-line {
      padding: 2px 6px;
      border-bottom: 1px solid #222;
    }
    #drawLog .log-ok { color: #95d5b2; }
    #drawLog .log-err { color: #ff6b6b; }
    .section { display: none; }
    .section.active { display: block; }
  </style>
</head>
<body>
  <!-- ============ Main Menu ============ -->
  <div id="sectionMenu" class="section active">
    <h2>Onshape Tools</h2>
    <button class="btn-menu" onclick="showSection('sectionDrawing')">
      Drawing Creator
      <div class="menu-desc">Generate drawings for all parts in a Part Studio</div>
    </button>
    <button class="btn-menu" onclick="showSection('sectionScanner')">
      Tab Folder Scanner
      <div class="menu-desc">Scan documents and report folder structure</div>
    </button>
  </div>

  <!-- ============ Drawing Creator ============ -->
  <div id="sectionDrawing" class="section">
    <h3><button class="btn-back" onclick="showSection('sectionMenu')">Back</button> Drawing Creator</h3>

    <label>Part Studio URL</label>
    <input type="text" id="partStudioUrl" placeholder="https://cad.onshape.com/documents/.../w/.../e/...">

    <div class="btn-row">
      <button class="btn-draw" id="btnCreateDrawings">Create Drawings</button>
    </div>

    <div id="drawLog"></div>
  </div>

  <!-- ============ Tab Folder Scanner ============ -->
  <div id="sectionScanner" class="section">
    <h3><button class="btn-back" onclick="showSection('sectionMenu')">Back</button> Tab Folder Scanner</h3>

    <label>Folder IDs (one per line)</label>
    <textarea id="folderIds" placeholder="e.g. 0e6a83bfe36bbb4968b747fb"></textarea>

    <label>Dashboard URL</label>
    <input type="text" id="dashboardUrl" placeholder="https://your-dashboard.onrender.com">

    <div class="btn-row">
      <button class="btn-scan" id="btnScan">Scan All</button>
      <button class="btn-rescan" id="btnRescan">Re-scan This Doc</button>
    </div>

    <div id="status"></div>
    <div id="results">
      <div class="summary" id="summaryText"></div>
      <div id="resultList"></div>
    </div>
  </div>

  <script>
    function showSection(id) {
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }
  </script>
  <script src="popup.js"></script>
</body>
</html>
